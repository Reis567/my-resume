    <title>Matheus dos Reis — Desenvolvedor Full-Stack</title>
    <script>
      // Aplica tema e idioma antes da renderização para evitar flash (FOUC).
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

          var forcedTheme = params.get('theme');
          var storedTheme = localStorage.getItem('theme');
          var theme =
            (forcedTheme === 'dark' || forcedTheme === 'light' ? forcedTheme : null) ||
            storedTheme ||
            (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);

          var forcedLang = params.get('lang');
          var storedLang = localStorage.getItem('lang');
          var navLang =
            navigator.language && navigator.language.toLowerCase().indexOf('pt') === 0 ? 'pt' : 'en';
          var lang =
            (forcedLang === 'pt' || forcedLang === 'en' ? forcedLang : null) ||
            storedLang ||
            navLang;
          document.documentElement.setAttribute('lang', lang === 'pt' ? 'pt-BR' : 'en');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
